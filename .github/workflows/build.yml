# 打包并测试可执行文件：在 Windows / macOS / Linux 上分别用 PyInstaller 打成
# 单文件成品，然后「直接运行成品」做冒烟测试（不跑源码，只验证打包产物能否启动）。
#
# 与 ci.yml 的区别：
#   - ci.yml        测的是「源代码」在各系统的兼容性
#   - build.yml(本) 测的是「打包好的 exe/app」能不能真的跑起来

name: 打包并测试可执行文件

on:
  push:
  workflow_dispatch:      # 支持在 Actions 页面手动触发

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装打包工具 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 打包成单文件可执行程序
        run: python build.py

      # —— 冒烟测试：直接运行打包产物，验证服务能启动并返回 HTTP 200 ——
      # GET / 只返回内置的 index.html，不需要真实 API Key，故用假配置即可启动。
      - name: 运行成品冒烟测试（Linux / macOS）
        if: runner.os != 'Windows'
        run: |
          cat > dist/config.json <<'JSON'
          {"api_key":"ci-dummy-key","base_url":"http://127.0.0.1:1/v1","model":"dummy","workspace":"."}
          JSON
          ./dist/mini-qoder &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/ || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          if [ "$ok" = "1" ]; then
            echo "✅ 成品可正常启动并响应 HTTP 200"
          else
            echo "❌ 成品未能在 30 秒内响应"
            exit 1
          fi

      - name: 运行成品冒烟测试（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cfg = '{"api_key":"ci-dummy-key","base_url":"http://127.0.0.1:1/v1","model":"dummy","workspace":"."}'
          Set-Content -Path dist\config.json -Value $cfg -Encoding utf8
          $p = Start-Process -FilePath "dist\mini-qoder.exe" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8081/" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if ($ok) {
            Write-Host "✅ 成品可正常启动并响应 HTTP 200"
          } else {
            Write-Host "❌ 成品未能在 30 秒内响应"
            exit 1
          }

      - name: 上传成品（可在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: mini-qoder-${{ matrix.os }}
          path: dist/mini-qoder*
          if-no-files-found: error
